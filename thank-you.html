<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Thank You | TimberWood</title>

<link rel="icon" href="favicon.png" type="image/x-icon">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        .success {
            width: min(90%, 500px);
            padding: 45px 30px;
            text-align: center;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 15px 50px rgba(0,0,0,.1);
        }

        .success-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0 0 12px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 22px;
            color: #fff;
            background: #5c3d2e;
            text-decoration: none;
            border-radius: 8px;
        }

    </style>

</head>

<body>

    <div class="success">

        <div class="success-icon">✓</div>

        <h1>Message Sent!</h1>

        <p>
            Thank you for contacting TimberWood.
            We have received your message and will
            get back to you soon.
        </p>

        <a href="index.html">
            Home
        </a>

    </div>

</body>

</html>
